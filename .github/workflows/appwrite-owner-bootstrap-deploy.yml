name: Deploy locked owner bootstrap scaffold

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure least-privilege scopes while keeping function locked
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6afcbe4e002df50df86f
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          FUNCTION_ID: nova-owner-bootstrap
        run: |
          node <<'NODE'
          const endpoint = process.env.APPWRITE_ENDPOINT;
          const project = process.env.APPWRITE_PROJECT_ID;
          const key = process.env.APPWRITE_API_KEY;
          const id = process.env.FUNCTION_ID;
          if (!key) throw new Error('Missing APPWRITE_API_KEY');
          const headers = {
            'X-Appwrite-Project': project,
            'X-Appwrite-Key': key,
            'Content-Type': 'application/json'
          };
          async function main() {
            const beforeResponse = await fetch(endpoint + '/functions/' + encodeURIComponent(id), { headers });
            const before = await beforeResponse.json().catch(() => ({}));
            if (!beforeResponse.ok) throw new Error('Cannot inspect function. HTTP ' + beforeResponse.status);
            const beforeExecute = before.execute || [];
            const executeIsSafe = beforeExecute.length === 0 || (beforeExecute.length === 1 && beforeExecute[0] === 'users');
            if (before.enabled !== false || !executeIsSafe) {
              throw new Error('Function is not disabled or has unsafe execute access; refusing deployment.');
            }
            const response = await fetch(endpoint + '/functions/' + encodeURIComponent(id), {
              method: 'PUT',
              headers,
              body: JSON.stringify({ name: before.name, scopes: ['rows.read', 'rows.write'] })
            });
            const raw = await response.text();
            let data = {};
            try { data = raw ? JSON.parse(raw) : {}; } catch {}
            if (!response.ok) throw new Error('Scope update failed. HTTP ' + response.status + ' ' +
              JSON.stringify({ code: data.code, type: data.type, message: data.message }));
            const configuredExecute = data.execute || [];
            const configuredExecuteIsSafe = configuredExecute.length === 0 || (configuredExecute.length === 1 && configuredExecute[0] === 'users');
            if (data.enabled !== false || !configuredExecuteIsSafe ||
                !(data.scopes || []).includes('rows.read') ||
                !(data.scopes || []).includes('rows.write') ||
                (data.scopes || []).length !== 2) {
              throw new Error('Least-privilege or locked-state verification failed.');
            }
            console.log('FUNCTION_ENABLED=false');
            console.log('EXECUTE_USERS_ONLY=' + (finalExecute.length === 1 && finalExecute[0] === 'users'));
            console.log('ROWS_READ_SCOPE=true');
            console.log('ROWS_WRITE_SCOPE=true');
          }
          main().catch(error => {
            console.error('SCOPE_CONFIGURATION_FAILED:', error.message);
            process.exit(1);
          });
          NODE

      - name: Validate function JavaScript
        run: node --check appwrite/functions/nova-owner-bootstrap/index.js

      - name: Package function source
        run: |
          cd appwrite/functions/nova-owner-bootstrap
          tar -czf "$RUNNER_TEMP/nova-owner-bootstrap.tar.gz" .

      - name: Upload inactive deployment to Appwrite
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6afcbe4e002df50df86f
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          FUNCTION_ID: nova-owner-bootstrap
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const endpoint = process.env.APPWRITE_ENDPOINT;
          const project = process.env.APPWRITE_PROJECT_ID;
          const key = process.env.APPWRITE_API_KEY;
          const functionId = process.env.FUNCTION_ID;
          if (!key) throw new Error('Missing APPWRITE_API_KEY');

          async function main() {
            const headers = {
              'X-Appwrite-Project': project,
              'X-Appwrite-Key': key
            };
            const check = await fetch(endpoint + '/functions/' + encodeURIComponent(functionId), { headers });
            const current = await check.json().catch(() => ({}));
            if (!check.ok) throw new Error('Cannot inspect function: HTTP ' + check.status);
            const scopes = current.scopes || [];
            const currentExecute = current.execute || [];
            const currentExecuteIsSafe = currentExecute.length === 0 || (currentExecute.length === 1 && currentExecute[0] === 'users');
            if (current.enabled !== false || !currentExecuteIsSafe ||
                !scopes.includes('rows.read') || !scopes.includes('rows.write') || scopes.length !== 2) {
              throw new Error('Function is not in the expected locked, least-privilege state. Deployment aborted.');
            }

            const form = new FormData();
            const archive = fs.readFileSync(process.env.RUNNER_TEMP + '/nova-owner-bootstrap.tar.gz');
            form.append('code', new Blob([archive], { type: 'application/gzip' }), 'nova-owner-bootstrap.tar.gz');
            form.append('activate', 'false');
            form.append('entrypoint', 'index.js');
            form.append('commands', '');

            const response = await fetch(endpoint + '/functions/' + encodeURIComponent(functionId) + '/deployments', {
              method: 'POST',
              headers,
              body: form
            });
            const raw = await response.text();
            let data = {};
            try { data = raw ? JSON.parse(raw) : {}; } catch {}
            if (!response.ok) {
              throw new Error('Deployment upload failed: HTTP ' + response.status + ' ' + JSON.stringify({
                code: data.code, type: data.type, message: data.message
              }));
            }
            if (!data.$id) throw new Error('Appwrite did not return a deployment ID.');
            console.log('DEPLOYMENT_CREATED=true');
            console.log('DEPLOYMENT_ID=' + data.$id);
            console.log('DEPLOYMENT_STATUS=' + data.status);
            console.log('DEPLOYMENT_ACTIVATED=false');

            let deployment = data;
            for (let attempt = 1; attempt <= 18; attempt++) {
              const statusResponse = await fetch(
                endpoint + '/functions/' + encodeURIComponent(functionId) +
                '/deployments/' + encodeURIComponent(data.$id),
                { headers }
              );
              const statusRaw = await statusResponse.text();
              let statusData = {};
              try { statusData = statusRaw ? JSON.parse(statusRaw) : {}; } catch {}
              if (!statusResponse.ok) {
                throw new Error('Cannot inspect deployment status. HTTP ' + statusResponse.status);
              }
              deployment = statusData;
              console.log('BUILD_CHECK=' + attempt);
              console.log('BUILD_STATUS=' + deployment.status);
              if (['ready', 'active', 'failed'].includes(deployment.status)) break;
              await new Promise(resolve => setTimeout(resolve, 10000));
            }

            const finalCheck = await fetch(
              endpoint + '/functions/' + encodeURIComponent(functionId),
              { headers }
            );
            const finalFunction = await finalCheck.json().catch(() => ({}));
            if (!finalCheck.ok) throw new Error('Cannot verify final function state.');
            if (deployment.status === 'failed') throw new Error('Appwrite deployment build failed.');
            if (!['ready', 'active'].includes(deployment.status)) {
              throw new Error('Deployment did not become ready within 3 minutes.');
            }
            const finalExecute = finalFunction.execute || [];
            const finalExecuteIsSafe = finalExecute.length === 0 || (finalExecute.length === 1 && finalExecute[0] === 'users');
            if (finalFunction.enabled !== false ||
                !finalExecuteIsSafe ||
                (finalFunction.scopes || []).length !== 2 ||
                !(finalFunction.scopes || []).includes('rows.read') ||
                !(finalFunction.scopes || []).includes('rows.write')) {
              throw new Error('Function lock or least-privilege verification failed.');
            }
            console.log('DEPLOYMENT_BUILD_COMPLETE=true');
            console.log('FUNCTION_ENABLED=false');
            console.log('EXECUTE_PERMISSIONS=0');
            console.log('FUNCTION_SCOPES=2');
            console.log('NO_FUNCTION_ACTIVATION_OR_PUBLIC_ACCESS=true');
          }

          main().catch(error => {
            console.error('DEPLOYMENT_FAILED:', error.message);
            process.exit(1);
          });
          NODE
