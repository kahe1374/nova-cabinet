name: Activate NOVA admin API with public order intake and read-only admin controls

on:
  workflow_dispatch:
  push:
    paths:
      - 'appwrite/functions/nova-admin-api/**'
      - '.github/workflows/appwrite-admin-api-readonly-activate.yml'

permissions:
  contents: read

jobs:
  activate-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run security regression tests
        run: |
          node --check appwrite/functions/nova-admin-api/index.js
          node --test appwrite/functions/nova-admin-api/test/admin-api.test.mjs
      - name: Deploy API and enable consented public order intake
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6afcbe4e002df50df86f
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          FUNCTION_ID: nova-admin-api
          OWNER_ID: user:6afdf252002cc39270ab
        run: |
          node <<'NODE'
          const endpoint = process.env.APPWRITE_ENDPOINT;
          const project = process.env.APPWRITE_PROJECT_ID;
          const key = process.env.APPWRITE_API_KEY;
          const id = process.env.FUNCTION_ID;
          const owner = process.env.OWNER_ID;
          if (!key) throw new Error('Missing APPWRITE_API_KEY');
          const headers = { 'X-Appwrite-Project': project, 'X-Appwrite-Key': key, 'Content-Type': 'application/json' };
          async function request(url, options={}) {
            const r = await fetch(endpoint + url, { ...options, headers: { ...headers, ...(options.headers||{}) } });
            const data = await r.json().catch(()=>({}));
            if (!r.ok) throw new Error('Appwrite HTTP '+r.status+' '+JSON.stringify({code:data.code,type:data.type,message:data.message}));
            return data;
          }
          async function main() {
            const current = await request('/functions/'+encodeURIComponent(id));
            const currentScopes=current.scopes||[];
            const ownerReadOnly=current.execute?.length===1 && current.execute[0]===owner && currentScopes.length===1 && currentScopes[0]==='rows.read';
            const publicIntake=current.execute?.length===1 && current.execute[0]==='any' && currentScopes.includes('rows.read') && currentScopes.includes('rows.write') && currentScopes.every(s=>['rows.read','rows.write','storage.read','storage.write'].includes(s));
            if (!ownerReadOnly && !publicIntake) throw new Error('Unexpected function permissions; refusing deployment.');
            if (current.enabled !== true && current.enabled !== false) throw new Error('Function state is not safely verifiable.');
            if (!currentScopes.includes('rows.read')) throw new Error('Function lacks rows.read scope.');
            const variableEndpoint='/functions/'+encodeURIComponent(id)+'/variables';
            const desiredVariables=[
              {variableId:'nova-public-intake-enabled',key:'NOVA_PUBLIC_ORDER_INTAKE_ENABLED',value:'true',secret:false},
              {variableId:'nova-admin-api-readonly',key:'NOVA_ADMIN_API_READ_ONLY',value:'true',secret:false},
              {variableId:'nova-public-ai-intake-enabled',key:'NOVA_PUBLIC_AI_INTAKE_ENABLED',value:'true',secret:false}
            ];
            const existingVariables=await request(variableEndpoint);
            for (const desired of desiredVariables) {
              const existing=(existingVariables.variables||[]).find(v=>v.key===desired.key);
              if (existing) {
                const variableId=existing.$id||existing.id||existing.variableId;
                if (!variableId) throw new Error('Existing Appwrite variable has no readable identifier: '+desired.key);
                await request(variableEndpoint+'/'+encodeURIComponent(variableId),{
                  method:'PUT',body:JSON.stringify({key:desired.key,value:desired.value,secret:desired.secret})
                });
              } else {
                await request(variableEndpoint,{method:'POST',body:JSON.stringify(desired)});
              }
            }
            const tar = require('node:child_process').execFileSync('tar',['-czf','-','-C','appwrite/functions/nova-admin-api','.']);
            const form = new FormData();
            form.append('code',new Blob([tar],{type:'application/gzip'}),'nova-admin-api.tar.gz');
            form.append('activate','true');
            form.append('entrypoint','index.js');
            form.append('commands','');
            const upload = await fetch(endpoint+'/functions/'+encodeURIComponent(id)+'/deployments',{
              method:'POST',headers:{'X-Appwrite-Project':project,'X-Appwrite-Key':key},body:form
            });
            const deployment = await upload.json().catch(()=>({}));
            if(!upload.ok || !deployment.$id) throw new Error('Deployment failed HTTP '+upload.status+' '+JSON.stringify({code:deployment.code,message:deployment.message}));
            let state=deployment;
            for(let i=0;i<24;i++){
              state=await request('/functions/'+encodeURIComponent(id)+'/deployments/'+encodeURIComponent(deployment.$id));
              console.log('BUILD_STATUS='+state.status);
              if(['ready','active','failed'].includes(state.status)) break;
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
            if(!['ready','active'].includes(state.status)) throw new Error('Deployment did not become ready.');
            const latest=await request('/functions/'+encodeURIComponent(id));
            const payload={
              name:latest.name,runtime:latest.runtime,execute:['any'],events:latest.events||[],schedule:latest.schedule||'',
              timeout:latest.timeout||30,enabled:true,logging:latest.logging!==false,entrypoint:'index.js',
              commands:latest.commands||'',scopes:['rows.read','rows.write','storage.read','storage.write'],deploymentId:deployment.$id
            };
            await request('/functions/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(payload)});
            const final=await request('/functions/'+encodeURIComponent(id));
            const finalVars=await request(variableEndpoint);
            const varMap=new Map((finalVars.variables||[]).map(v=>[v.key,v.value]));
            if(final.enabled!==true || final.execute?.length!==1 || final.execute[0]!=='any' ||
              final.scopes?.length!==4 || !['rows.read','rows.write','storage.read','storage.write'].every(s=>final.scopes.includes(s)) ||
              final.deploymentId!==deployment.$id ||
              varMap.get('NOVA_PUBLIC_ORDER_INTAKE_ENABLED')!=='true' ||
              varMap.get('NOVA_PUBLIC_AI_INTAKE_ENABLED')!=='true' ||
              varMap.get('NOVA_ADMIN_API_READ_ONLY')!=='true') {
              console.log('VERIFY_ENABLED='+final.enabled);
              console.log('VERIFY_EXECUTE='+(final.execute||[]).join(','));
              console.log('VERIFY_SCOPES='+(final.scopes||[]).join(','));
              console.log('VERIFY_DEPLOYMENT_MATCH='+(final.deploymentId===deployment.$id));
              console.log('VERIFY_PUBLIC_INTAKE='+varMap.get('NOVA_PUBLIC_ORDER_INTAKE_ENABLED'));
              console.log('VERIFY_ADMIN_READ_ONLY='+varMap.get('NOVA_ADMIN_API_READ_ONLY'));
              throw new Error('Final public-intake/read-only-admin verification failed.');
            }
            console.log('PUBLIC_ORDER_INTAKE_ENABLED=true');
            console.log('PUBLIC_AI_INTAKE_ENABLED=true');
            console.log('FUNCTION_STORAGE_SCOPES=storage.read,storage.write');
            console.log('PUBLIC_EXECUTE_ANY=true');
            console.log('ADMIN_API_READ_ONLY=true');
            console.log('FUNCTION_SCOPES=rows.read,rows.write');
            console.log('ACTIVE_DEPLOYMENT='+deployment.$id);
          }
          main().catch(e=>{console.error('ACTIVATION_FAILED:',e.message);process.exit(1)});
          NODE
