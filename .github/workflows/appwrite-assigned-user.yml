name: Appwrite assigned user diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-relationship-state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read relationship metadata without changes
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6afcbe4e002df50df86f
          APPWRITE_DATABASE_ID: 6afcc05300302d503754
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          node <<'NODE'
          const endpoint = process.env.APPWRITE_ENDPOINT;
          const db = encodeURIComponent(process.env.APPWRITE_DATABASE_ID);
          const headers = {
            'X-Appwrite-Project': process.env.APPWRITE_PROJECT_ID,
            'X-Appwrite-Key': process.env.APPWRITE_API_KEY
          };
          async function get(path) {
            const response = await fetch(endpoint + path, { headers });
            const raw = await response.text();
            let data = {};
            try { data = raw ? JSON.parse(raw) : {}; } catch {}
            return { status: response.status, data };
          }
          async function main() {
            if (!process.env.APPWRITE_API_KEY) throw new Error('Missing APPWRITE_API_KEY');
            const table = await get(`/tablesdb/${db}/tables/orders`);
            console.log('ORDERS_TABLE_HTTP:', table.status);
            console.log('ORDERS_TABLE_META:', JSON.stringify(table.data && {
              $id: table.data.$id, name: table.data.name, enabled: table.data.enabled,
              rowSecurity: table.data.rowSecurity
            }));
            const list = await get(`/tablesdb/${db}/tables/orders/columns?limit=100`);
            console.log('ORDERS_COLUMNS_HTTP:', list.status);
            const cols = list.data.columns || [];
            console.log('ORDERS_COLUMNS:', JSON.stringify(cols.map(c => ({
              key: c.key, type: c.type, status: c.status, relatedTableId: c.relatedTableId,
              relationType: c.relationType, twoWay: c.twoWay, onDelete: c.onDelete
            }))));
            for (const key of ['assigned_to', 'assigned_user']) {
              const direct = await get(`/tablesdb/${db}/tables/orders/columns/${encodeURIComponent(key)}`);
              console.log(`DIRECT_GET_${key.toUpperCase()}_HTTP:`, direct.status);
              console.log(`DIRECT_GET_${key.toUpperCase()}_BODY:`, JSON.stringify(direct.data));
            }
            console.log('READ_ONLY_DIAGNOSTIC_COMPLETE. No schema or row changes were made.');
          }
          main().catch(e => { console.error(e.message); process.exit(1); });
          NODE
