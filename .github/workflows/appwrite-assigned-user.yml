name: Appwrite assigned user ID column check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-assigned-user-id:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Create optional scalar user ID column safely
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6afcbe4e002df50df86f
          APPWRITE_DATABASE_ID: 6afcc05300302d503754
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          node <<'NODE'
          const endpoint = process.env.APPWRITE_ENDPOINT;
          const db = encodeURIComponent(process.env.APPWRITE_DATABASE_ID);
          const key = 'assigned_user_id';
          const headers = {
            'X-Appwrite-Project': process.env.APPWRITE_PROJECT_ID,
            'X-Appwrite-Key': process.env.APPWRITE_API_KEY,
            'Content-Type': 'application/json'
          };

          async function call(method, path, body) {
            const r = await fetch(endpoint + path, {
              method, headers,
              body: body === undefined ? undefined : JSON.stringify(body)
            });
            const raw = await r.text();
            let data = {};
            try { data = raw ? JSON.parse(raw) : {}; } catch {}
            return { status: r.status, data, raw };
          }

          async function main() {
            if (!process.env.APPWRITE_API_KEY) throw new Error('Missing APPWRITE_API_KEY');
            const columnsPath = `/tablesdb/${db}/tables/orders/columns`;
            const list = await call('GET', columnsPath + '?limit=100');
            console.log('INITIAL_COLUMNS_HTTP:', list.status);
            if (list.status !== 200) throw new Error('Could not inspect orders columns; stopped without changes.');

            let column = (list.data.columns || []).find(c => c.key === key);
            if (column) {
              console.log('EXISTING_COLUMN:', JSON.stringify({
                key: column.key, type: column.type, status: column.status, size: column.size
              }));
              if (column.type !== 'varchar') throw new Error('A column with this key exists but is not varchar; no changes made.');
              if (column.status !== 'available') throw new Error('Existing column is not available; no changes made.');
              console.log('COMPLETE: assigned_user_id already exists as an available varchar column.');
              return;
            }

            const created = await call('POST', columnsPath + '/varchar', {
              key, size: 36, required: false
            });
            console.log('CREATE_HTTP_STATUS:', created.status);
            console.log('CREATE_RESPONSE:', JSON.stringify(created.data));

            if (created.status === 409) {
              const verify = await call('GET', columnsPath + '?limit=100');
              console.log('POST_409_RECHECK_HTTP:', verify.status);
              const after409 = (verify.data.columns || []).find(c => c.key === key);
              if (after409) {
                console.log('POST_409_COLUMN_STATE:', JSON.stringify({
                  key: after409.key, type: after409.type, status: after409.status
                }));
              }
              throw new Error('Appwrite returned 409. Rechecked once; no retry, deletion, or other schema change was attempted.');
            }
            if (created.status !== 201 && created.status !== 202) {
              throw new Error('Column creation was rejected; no retry was attempted.');
            }

            for (let i = 0; i < 45; i++) {
              const check = await call('GET', columnsPath + '?limit=100');
              if (check.status === 200) {
                column = (check.data.columns || []).find(c => c.key === key);
                if (column && column.status === 'available') {
                  console.log('FINAL_COLUMN:', JSON.stringify({
                    key: column.key, type: column.type, status: column.status, size: column.size
                  }));
                  console.log('COMPLETE: orders.assigned_user_id is available as an optional varchar(36).');
                  return;
                }
                if (column && ['failed', 'stuck'].includes(column.status)) {
                  throw new Error('Column entered status ' + column.status + '.');
                }
              }
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            throw new Error('Column did not become available within 90 seconds; no further changes attempted.');
          }

          main().catch(error => {
            console.error('CHECK_FAILED:', error.message);
            process.exit(1);
          });
          NODE
