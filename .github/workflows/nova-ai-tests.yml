name: NOVA AI scaffold tests

on:
  push:
    branches: [main]
    paths:
      - "ai/gateway/**"
      - ".github/workflows/nova-ai-tests.yml"
  pull_request:
    paths:
      - "ai/gateway/**"
      - ".github/workflows/nova-ai-tests.yml"

permissions:
  contents: read

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai/gateway/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: PYTHONPATH=. pytest -q
