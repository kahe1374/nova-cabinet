name: Optimize NOVA opening video
# one-time run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nova-optimize-opening-video.yml"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Convert opening video for mobile playback
        run: |
          ffmpeg -y -i "kling_20261128_VIDEO_Create_a_b_121_0.mp4.mov" \
            -vf "scale='min(1280,iw)':-2" \
            -c:v libx264 -preset slow -crf 26 -profile:v main -level 3.1 -pix_fmt yuv420p \
            -c:a aac -b:a 96k -movflags +faststart \
            "nova-opening-optimized.mp4"
      - name: Replace video source and remove temporary workflow
        run: |
          sed -i 's#\./kling_20261128_VIDEO_Create_a_b_121_0\.mp4\.mov#./nova-opening-optimized.mp4#g' index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nova-opening-optimized.mp4 index.html
          git rm .github/workflows/nova-optimize-opening-video.yml
          git commit -m "Optimize opening video for smooth mobile playback"
          git push
