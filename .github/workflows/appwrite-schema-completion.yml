name: Appwrite schema completion diagnostic (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the order assignment field without changing schema or data
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6afcbe4e002df50df86f
          APPWRITE_DATABASE_ID: 6afcc05300302d503754
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          node <<'NODE'
          const endpoint = process.env.APPWRITE_ENDPOINT;
          const db = encodeURIComponent(process.env.APPWRITE_DATABASE_ID);
          const headers = {
            'X-Appwrite-Project': process.env.APPWRITE_PROJECT_ID,
            'X-Appwrite-Key': process.env.APPWRITE_API_KEY
          };
          async function get(path) {
            const response = await fetch(endpoint + path, { headers });
            const raw = await response.text();
            let data = {};
            try { data = raw ? JSON.parse(raw) : {}; } catch {}
            if (!response.ok) throw new Error('Appwrite read failed HTTP ' + response.status + ': ' + path);
            return data;
          }
          async function main() {
            if (!process.env.APPWRITE_API_KEY) throw new Error('Missing APPWRITE_API_KEY');
            const [table, columns] = await Promise.all([
              get('/tablesdb/' + db + '/tables/orders'),
              get('/tablesdb/' + db + '/tables/orders/columns?limit=100')
            ]);
            const items = columns.columns || [];
            const assigned = items.find(c => c.key === 'assigned_user_id');
            const legacyRelation = items.find(c => c.key === 'assigned_to');
            console.log('ORDERS_TABLE_ENABLED=' + String(table.enabled === true));
            console.log('ORDERS_ROW_SECURITY=' + String(table.rowSecurity === true));
            console.log('ORDERS_TABLE_PRIVATE=' + String((table.$permissions || []).length === 0));
            console.log('ASSIGNED_USER_ID=' + JSON.stringify(assigned ? {
              key: assigned.key, type: assigned.type, required: assigned.required, size: assigned.size, status: assigned.status
            } : null));
            console.log('LEGACY_ASSIGNED_TO=' + JSON.stringify(legacyRelation ? {
              key: legacyRelation.key, type: legacyRelation.type, status: legacyRelation.status
            } : null));
            if (table.rowSecurity !== true || (table.$permissions || []).length !== 0) {
              throw new Error('Orders table privacy invariant failed; no changes made.');
            }
            if (!assigned || assigned.type !== 'varchar' || assigned.status !== 'available' || assigned.required === true || assigned.size < 36) {
              throw new Error('orders.assigned_user_id is not the expected optional varchar(36); no changes made.');
            }
            console.log('SCHEMA_DIAGNOSTIC_PASSED=true');
            console.log('READ_ONLY=true');
            console.log('NO_SCHEMA_OR_ROW_CHANGES=true');
          }
          main().catch(error => { console.error('SCHEMA_DIAGNOSTIC_FAILED:', error.message); process.exit(1); });
          NODE
