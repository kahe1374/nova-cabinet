name: Appwrite schema completion diagnostic (read-only)
# Triggered for the consented public-order schema verification; this workflow performs GET requests only.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/appwrite-schema-completion.yml'

permissions:
  contents: read

jobs:
  inspect-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect Appwrite schema and public endpoint with no-write validation
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6afcbe4e002df50df86f
          APPWRITE_DATABASE_ID: 6afcc05300302d503754
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          node <<'NODE'
          const endpoint = process.env.APPWRITE_ENDPOINT;
          const db = encodeURIComponent(process.env.APPWRITE_DATABASE_ID);
          const headers = {
            'X-Appwrite-Project': process.env.APPWRITE_PROJECT_ID,
            'X-Appwrite-Key': process.env.APPWRITE_API_KEY
          };
          const tables = [
            'app_users', 'lead_requests', 'customers', 'orders', 'order_items',
            'workshop_requests', 'order_status_history', 'order_files',
            'audit_log', 'ai_design_requests', 'ai_design_pricing'
          ];
          async function get(path) {
            const response = await fetch(endpoint + path, { method: 'GET', headers });
            const raw = await response.text();
            let data = {};
            try { data = raw ? JSON.parse(raw) : {}; } catch {}
            if (!response.ok) throw new Error('Appwrite read failed HTTP ' + response.status + ': ' + path);
            return data;
          }
          async function inspect(tableId) {
            const base = '/tablesdb/' + db + '/tables/' + encodeURIComponent(tableId);
            const [table, columns] = await Promise.all([
              get(base),
              get(base + '/columns?limit=100')
            ]);
            const keys = (columns.columns || []).map(c => ({
              key: c.key, type: c.type, required: c.required === true,
              size: c.size ?? null, status: c.status,
              relatedTable: c.relatedTable ?? null, relationType: c.relationType ?? null,
              twoWay: c.twoWay ?? null, twoWayKey: c.twoWayKey ?? null
            }));
            const privateTable = Array.isArray(table.$permissions) && table.$permissions.length === 0;
            const secure = table.enabled === true && table.rowSecurity === true && privateTable;
            console.log('TABLE ' + tableId + ' ' + JSON.stringify({
              enabled: table.enabled === true,
              rowSecurity: table.rowSecurity === true,
              private: privateTable,
              columnCount: keys.length,
              columns: keys
            }));
            return { tableId, secure, keys };
          }
          async function main() {
            if (!process.env.APPWRITE_API_KEY) throw new Error('Missing APPWRITE_API_KEY');
            const results = await Promise.all(tables.map(inspect));
            const insecure = results.filter(x => !x.secure);
            if (insecure.length) throw new Error('Table privacy/enabled invariant failed: ' + insecure.map(x => x.tableId).join(','));
            const orders = results.find(x => x.tableId === 'orders');
            const assigned = orders.keys.find(c => c.key === 'assigned_user_id');
            const legacy = orders.keys.find(c => c.key === 'assigned_to');
            const customerRelation = orders.keys.find(c => c.key === 'customer');
            const requiredOrderKeys = ['order_number', 'title', 'order_type', 'status', 'currency', 'paid_amount'];
            const missingOrderKeys = requiredOrderKeys.filter(key => !orders.keys.some(c => c.key === key));
            console.log('ORDERS_CUSTOMER_RELATION=' + JSON.stringify(customerRelation || null));
            console.log('ORDERS_REQUIRED_FIELDS=' + JSON.stringify(requiredOrderKeys.map(key => orders.keys.find(c => c.key === key) || null)));
            console.log('ORDERS_ASSIGNED_USER_ID=' + JSON.stringify(assigned || null));
            console.log('ORDERS_LEGACY_ASSIGNED_TO=' + JSON.stringify(legacy || null));
            if (missingOrderKeys.length) throw new Error('Missing required order columns: ' + missingOrderKeys.join(','));
            if (!customerRelation || customerRelation.type !== 'relationship') throw new Error('orders.customer relationship column is missing.');
            if (!assigned || assigned.type !== 'varchar' || assigned.status !== 'available' || assigned.required || assigned.size < 36) {
              throw new Error('orders.assigned_user_id must be an optional available varchar with size >= 36.');
            }
            console.log('SCHEMA_DIAGNOSTIC_PASSED=true');
            console.log('READ_ONLY=true');
            console.log('NO_SCHEMA_OR_ROW_CHANGES=true');
            const fn = await get('/functions/nova-admin-api');
            console.log('FUNCTION_SECURITY=' + JSON.stringify({
              enabled: fn.enabled === true,
              execute: fn.execute || [],
              scopes: fn.scopes || [],
              deploymentId: fn.deploymentId || null,
              environmentVariableNames: (fn.vars || []).map(v => v.key).sort()
            }));
            const variableState=await get('/functions/nova-admin-api/variables');
            const variables=(variableState.variables||[]);
            console.log('FUNCTION_VARIABLES=' + JSON.stringify(variables.map(v=>({
              id:v.$id||v.id||null,key:v.key,secret:v.secret===true
            }))));
            if (fn.enabled!==true || fn.execute?.length!==1 || fn.execute[0]!=='any' ||
              fn.scopes?.length!==2 || !fn.scopes.includes('rows.read') || !fn.scopes.includes('rows.write')) {
              throw new Error('Public function execution permissions/scopes are not in the expected state.');
            }
            const requiredVars=new Map(variables.map(v=>[v.key,v.value]));
            if (requiredVars.get('NOVA_PUBLIC_ORDER_INTAKE_ENABLED')!=='true' ||
              requiredVars.get('NOVA_ADMIN_API_READ_ONLY')!=='true') {
              throw new Error('Function feature flags are missing or incorrect.');
            }
            const smoke=await fetch(endpoint+'/functions/nova-admin-api/executions',{
              method:'POST',
              headers:{'X-Appwrite-Project':process.env.APPWRITE_PROJECT_ID,'Content-Type':'application/json'},
              body:JSON.stringify({
                body:JSON.stringify({action:'public_create_order',name:'x',phone:'123',type:'schema-smoke',idempotency_key:'invalid'}),
                async:false,method:'POST',headers:{origin:'https://kahe1374.github.io'}
              })
            });
            const execution=await smoke.json().catch(()=>({}));
            let smokeBody={};
            try { smokeBody=JSON.parse(execution.responseBody||'{}'); } catch {}
            if (!smoke.ok || execution.status!=='completed' || execution.responseStatusCode!==400 ||
              smokeBody.code!=='INVALID_PUBLIC_ORDER') {
              throw new Error('Public endpoint no-write smoke test failed: '+JSON.stringify({
                http:smoke.status,status:execution.status,responseStatusCode:execution.responseStatusCode,code:smokeBody.code
              }));
            }
            console.log('PUBLIC_ENDPOINT_NO_WRITE_SMOKE_PASSED=true');
          }
          main().catch(error => {
            console.error('SCHEMA_DIAGNOSTIC_FAILED:', error.message);
            process.exit(1);
          });
          NODE
