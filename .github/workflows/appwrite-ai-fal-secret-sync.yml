name: Sync FAL secret to Appwrite when already available in GitHub

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/appwrite-ai-fal-secret-sync.yml'

permissions:
  contents: read

jobs:
  sync-fal-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Transfer FAL_KEY securely without printing its value
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6afcbe4e002df50df86f
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: |
          node <<'NODE'
          const endpoint=process.env.APPWRITE_ENDPOINT,project=process.env.APPWRITE_PROJECT_ID,key=process.env.APPWRITE_API_KEY,fal=process.env.FAL_KEY;
          if(!key)throw new Error('Missing APPWRITE_API_KEY');
          if(!fal){
            console.log('FAL_KEY_SOURCE_CONFIGURED=false');
            console.log('NO_SECRET_VALUES_PRINTED=true');
            process.exit(0);
          }
          const headers={'X-Appwrite-Project':project,'X-Appwrite-Key':key,'Content-Type':'application/json'};
          async function main(){
            const path='/functions/nova-admin-api/variables';
            const list=await fetch(endpoint+path,{headers});
            const current=await list.json().catch(()=>({}));
            if(!list.ok)throw new Error('Cannot inspect Appwrite function variables HTTP '+list.status);
            const existing=(current.variables||[]).find(v=>v.key==='FAL_KEY');
            let response;
            if(existing){
              const id=existing.$id||existing.id||existing.variableId;
              if(!id)throw new Error('Existing FAL_KEY variable has no id.');
              response=await fetch(endpoint+path+'/'+encodeURIComponent(id),{
                method:'PUT',headers,body:JSON.stringify({key:'FAL_KEY',value:fal,secret:true})
              });
            }else{
              response=await fetch(endpoint+path,{
                method:'POST',headers,body:JSON.stringify({variableId:'nova-fal-key',key:'FAL_KEY',value:fal,secret:true})
              });
            }
            const result=await response.json().catch(()=>({}));
            if(!response.ok)throw new Error('FAL secret sync failed HTTP '+response.status+' '+JSON.stringify({code:result.code,type:result.type,message:result.message}));
            const verify=await fetch(endpoint+path,{headers});
            const vars=await verify.json().catch(()=>({}));
            const check=(vars.variables||[]).find(v=>v.key==='FAL_KEY');
            if(!verify.ok||!check||check.secret!==true)throw new Error('FAL_KEY secret verification failed.');
            console.log('FAL_KEY_SOURCE_CONFIGURED=true');
            console.log('FAL_KEY_APPWRITE_SECRET=true');
            console.log('NO_SECRET_VALUES_PRINTED=true');
          }
          main().catch(e=>{console.error('FAL_SECRET_SYNC_FAILED:',e.message);process.exit(1)});
          NODE
