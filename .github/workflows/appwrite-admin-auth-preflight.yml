name: Appwrite admin authentication preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-auth-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect Auth users, Functions and database permissions (read-only)
        env:
          APPWRITE_ENDPOINT: https://fra.cloud.appwrite.io/v1
          APPWRITE_PROJECT_ID: 6afcbe4e002df50df86f
          APPWRITE_DATABASE_ID: 6afcc05300302d503754
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
        run: |
          node <<'NODE'
          const endpoint = process.env.APPWRITE_ENDPOINT;
          const db = encodeURIComponent(process.env.APPWRITE_DATABASE_ID);
          const headers = {
            'X-Appwrite-Project': process.env.APPWRITE_PROJECT_ID,
            'X-Appwrite-Key': process.env.APPWRITE_API_KEY
          };

          async function get(path) {
            const response = await fetch(endpoint + path, { headers });
            const raw = await response.text();
            let data = {};
            try { data = raw ? JSON.parse(raw) : {}; } catch {}
            console.log('HTTP', response.status, path);
            if (!response.ok) {
              console.log('READ_ERROR', JSON.stringify({code:data.code,type:data.type,message:data.message}));
              return null;
            }
            return data;
          }

          async function main() {
            if (!process.env.APPWRITE_API_KEY) throw new Error('Missing APPWRITE_API_KEY');

            const users = await get('/users?limit=1');
            if (users) console.log('AUTH_USERS_SUMMARY', JSON.stringify({
              total: users.total,
              returned: (users.users || []).length,
              note: 'No email, phone, name, or credential data is logged.'
            }));

            const functions = await get('/functions?limit=100');
            if (functions) console.log('FUNCTIONS_SUMMARY', JSON.stringify({
              total: functions.total,
              functions: (functions.functions || []).map(f => ({
                id: f.$id, name: f.name, runtime: f.runtime,
                enabled: f.enabled, execute: f.execute,
                deploymentId: f.deploymentId
              }))
            }));

            for (const tableId of ['app_users', 'orders']) {
              const table = await get('/tablesdb/' + db + '/tables/' + encodeURIComponent(tableId));
              if (table) console.log('TABLE_ACCESS_SUMMARY', JSON.stringify({
                tableId, rowSecurity: table.rowSecurity,
                enabled: table.enabled,
                permissions: table.$permissions || table.permissions || []
              }));
            }
            console.log('AUTH_READINESS_INSPECTION_COMPLETE: read-only; no users, rows, permissions, functions, or schema were changed.');
          }

          main().catch(error => {
            console.error('INSPECTION_FAILED:', error.message);
            process.exit(1);
          });
          NODE
