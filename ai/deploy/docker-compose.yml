services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - nova_redis:/data
    restart: unless-stopped

  gateway:
    build:
      context: ../gateway
    environment:
      REDIS_URL: redis://redis:6379/0
      NOVA_JOB_TICKET_SECRET: ${NOVA_JOB_TICKET_SECRET}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    image: python:3.12-slim
    working_dir: /worker
    volumes:
      - ../worker:/worker:ro
    command: sh -c "pip install --no-cache-dir redis==5.2.1 && python worker.py"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  nova_redis:
